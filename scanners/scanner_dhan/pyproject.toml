[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scanner-dhan"
version = "0.1.0"
description = "A modular framework for DhanHQ trading scanners and strategy backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amit Datta" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]
dhan = ["dhanhq>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/scanner_dhan"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scanner_dhan"]

[[tool.mypy.overrides]]
module = ["dhanhq.*", "pandas.*"]
ignore_missing_imports = true

