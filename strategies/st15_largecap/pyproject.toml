[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "st15-largecap"
version = "0.1.0"
description = "ST15_LargeCap Positional Momentum Strategy for Large-Cap Equities"
readme = "readme/README.md"
requires-python = ">=3.11"
dependencies = [
    "dhanhq>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

